<!-- Modal Notifications -->
<div class="modal fade show" tabindex="-1"
     [ngStyle]="{display: showNotifications ? 'block' : 'none', background: showNotifications ? 'rgba(0,0,0,0.3)' : 'none'}"
     style="z-index: 1050;" *ngIf="showNotifications">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Notifications</h5>
        <button type="button" class="btn-close" (click)="closeNotifications()"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="notifLoading">Chargement...</div>
        <div *ngIf="notifError" class="alert alert-danger">{{ notifError }}</div>
        <ul class="list-group">
          <li *ngFor="let notif of unreadNotifications"
              class="list-group-item d-flex justify-content-between align-items-start"
              (click)="markOneRead(notif)"
              [ngClass]="{'bg-light': !notif._localRead}">
            <div class="me-2">
              <i [ngClass]="iconFor(notif.type)"></i>
            </div>
            <div class="flex-fill">
              <div class="d-flex justify-content-between">
                <strong>{{ notif.title || notif.action }}</strong>
                <small class="text-muted">{{ notif.timestamp | date:'short' }}</small>
              </div>
              <div class="small" [innerText]="notif.message"></div>
              <div class="mt-1">
                <span class="badge" [ngClass]="statusBadgeClass(parseStatus(notif.message))">{{ parseStatus(notif.message) }}</span>
                <span *ngIf="!notif._localRead" class="badge bg-primary ms-1">Nouveau</span>
              </div>
            </div>
          </li>
        </ul>
        <div *ngIf="!notifLoading && unreadNotifications.length === 0" class="alert alert-info mt-2">Aucune nouvelle notification.</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary btn-sm" (click)="markAllLocalRead()" [disabled]="unreadNotifications.length===0">Tout marquer comme lu</button>
        <button class="btn btn-primary btn-sm" (click)="gotoAllNotifications()">Voir toutes</button>
        <button class="btn btn-secondary btn-sm" (click)="closeNotifications()">Fermer</button>
      </div>
    </div>
  </div>
</div>
